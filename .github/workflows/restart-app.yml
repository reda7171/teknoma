name: Restart App Container

on:
  workflow_dispatch:

jobs:
  restart-app:
    name: Restart Next.js App on VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Restart App
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2222
          command_timeout: 10m
          script: |
            cd /var/www/riwayama
            echo "Nettoyage radical des conteneurs app..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker rm -f 6c16caadb77f_riwaya_app riwaya_app 2>/dev/null || true
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sh -c 'docker rm -f $(docker ps -a -q --filter "name=app") 2>/dev/null || true'
            echo "Relance propre via docker compose..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker compose up -d --no-deps --force-recreate app
            echo "Attente du démarrage (8s)..."
            sleep 8
            echo "Vérification statut du conteneur..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker ps --filter "name=riwaya_app"
            echo "Test HTTP local..."
            curl -I http://127.0.0.1:3000 || true
