name: Restart App Container

on:
  workflow_dispatch:

jobs:
  restart-app:
    name: Restart Next.js App on VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Restart App
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2222
          command_timeout: 10m
          script: |
            cd /var/www/riwayama
            echo "Relance sécurisée de l'application Riwaya..."
            if [ -f "scripts/deploy-zero-downtime.sh" ]; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sed -i 's/\r$//' scripts/deploy-zero-downtime.sh
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/deploy-zero-downtime.sh
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S ./scripts/deploy-zero-downtime.sh
            else
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker compose up -d --no-deps app
            fi
            echo "Vérification statut du conteneur..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker ps --filter "name=riwaya_app"
            echo "Test HTTP local..."
            curl -I http://127.0.0.1:3000/fr || true
