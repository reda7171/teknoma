name: Deploy Riwaya to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Requis pour SonarQube

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2222
          command_timeout: 60m
          script: |
            # Aller dans le dossier
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /var/www/riwayama
            cd /var/www/riwayama

            # Initialisation robuste de Git si absente
            if [ ! -d ".git" ]; then
              echo "Initialisation du depot Git..."
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git init
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git remote add origin https://github.com/reda7171/riwaya.git
            fi

            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/reda7171/riwaya.git
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git config --global --add safe.directory /var/www/riwayama

            # Synchronisation
            echo "Recuperation du code..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git fetch origin main
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git checkout -f main
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git reset --hard origin/main

            # Permissions et Cron
            if [ -d "scripts" ]; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/backup-db.sh
              (crontab -l 2>/dev/null | grep -q "backup-db.sh") || (crontab -l 2>/dev/null; echo "0 3 * * * /var/www/riwayama/scripts/backup-db.sh >> /var/www/riwayama/backups/backup.log 2>&1") | crontab -
            fi

            # ─── Page 502 personnalisee ────────────────────────────────────
            echo "Configuration de la page 502 custom..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /var/www/errors
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /var/www/riwayama/502.html /var/www/errors/502.html
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod 644 /var/www/errors/502.html

            # Ajouter error_page 502 dans nginx si pas encore configure
            NGINX_CONF="/etc/nginx/sites-enabled/default"
            if [ -f "$NGINX_CONF" ] && ! grep -q "502.html" "$NGINX_CONF"; then
              echo "Injection de error_page 502 dans nginx..."
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sed -i 's|server {|server {\n    error_page 502 /502_custom.html;\n    location = /502_custom.html { root /var/www/errors; internal; }\n|' "$NGINX_CONF"
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S nginx -t && echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl reload nginx || true
            fi
            # Renommer le fichier pour correspondre a la directive nginx
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /var/www/errors/502.html /var/www/errors/502_custom.html
            # ──────────────────────────────────────────────────────────────

            # Rebuild et Restart du service app
            echo "Rechargement du service..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker rm -f riwaya_app || true
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker compose up -d --build --force-recreate --no-deps app || echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker-compose up -d --build --force-recreate --no-deps app
