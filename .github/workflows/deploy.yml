name: Deploy Riwaya to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: reda7171/riwaya-app

jobs:
  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2222
          command_timeout: 60m
          script: |
            # Aller dans le dossier
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /var/www/riwayama
            cd /var/www/riwayama

            # Initialisation robuste de Git si absente
            if [ ! -d ".git" ]; then
              echo "Initialisation du depot Git..."
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git init
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git remote add origin https://github.com/reda7171/riwaya.git
            fi

            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/reda7171/riwaya.git
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git config --global --add safe.directory /var/www/riwayama

            # Synchronisation
            echo "Recuperation du code..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git fetch origin main
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git checkout -f main
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git reset --hard origin/main

            # Permissions et Cron
            if [ -d "scripts" ]; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/backup-db.sh
              (crontab -l 2>/dev/null | grep -q "backup-db.sh") || (crontab -l 2>/dev/null; echo "0 3 * * * /var/www/riwayama/scripts/backup-db.sh >> /var/www/riwayama/backups/backup.log 2>&1") | crontab -
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/vps-clean-cache.sh
              (crontab -l 2>/dev/null | grep -q "vps-clean-cache.sh") || (crontab -l 2>/dev/null; echo "0 4 * * * /var/www/riwayama/scripts/vps-clean-cache.sh >> /var/www/riwayama/backups/cache-clean.log 2>&1") | crontab -
              (crontab -l 2>/dev/null | grep -q "vps-status") || (crontab -l 2>/dev/null; echo "*/10 * * * * curl -s 'https://riwaya.store/api/cron/vps-status?alert_only=true' > /dev/null 2>&1") | crontab -
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/jumia-status-cron.sh
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /var/log/riwaya
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S touch /var/log/riwaya/jumia-status-cron.log
              (crontab -l 2>/dev/null | grep -q "jumia-status-cron.sh") || (crontab -l 2>/dev/null; echo "*/10 * * * * flock -n /tmp/riwaya-jumia-status.lock /var/www/riwayama/scripts/jumia-status-cron.sh >> /var/log/riwaya/jumia-status-cron.log 2>&1") | crontab -
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sed -i 's/\r$//' scripts/sync-ads-spend-cron.sh || true
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/sync-ads-spend-cron.sh
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S touch /var/log/riwaya/ads-spend-cron.log
              (crontab -l 2>/dev/null | grep -q "sync-ads-spend-cron.sh") || (crontab -l 2>/dev/null; echo "0 */2 * * * flock -n /tmp/riwaya-ads-spend.lock /var/www/riwayama/scripts/sync-ads-spend-cron.sh >> /var/log/riwaya/ads-spend-cron.log 2>&1") | crontab -
              (crontab -l 2>/dev/null | grep -q "abandoned-cart-reminder") || (crontab -l 2>/dev/null; echo "*/15 * * * * curl -s 'https://riwaya.store/api/cron/abandoned-cart-reminder?key=une_cle_secrete_pour_cron_2026' > /dev/null 2>&1") | crontab -
            fi

            # Authentification GHCR sur le VPS
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            # Pull de la nouvelle image pre-compilee AVANT le redemarrage
            echo "Telechargement de la nouvelle image Docker..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Garantir la presence des secrets WAHA dans .env pour permettre docker compose up sans valeur par defaut faible
            if [ -f ".env" ]; then
              if ! echo "${{ secrets.VPS_PASSWORD }}" | sudo -S grep -qE '^WAHA_DASHBOARD_PASSWORD=["'\'']?[^"'\''[:space:]#]+' .env; then
                RAND_WAHA_PASS=$(openssl rand -hex 24)
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sed -i '/^WAHA_DASHBOARD_PASSWORD=/d' .env
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sh -c "printf '\nWAHA_DASHBOARD_PASSWORD=%s\n' '${RAND_WAHA_PASS}' >> .env"
              fi
              if ! echo "${{ secrets.VPS_PASSWORD }}" | sudo -S grep -qE '^WAHA_API_KEY=["'\'']?[^"'\''[:space:]#]+' .env; then
                RAND_WAHA_KEY=$(openssl rand -hex 24)
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sed -i '/^WAHA_API_KEY=/d' .env
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sh -c "printf '\nWAHA_API_KEY=%s\n' '${RAND_WAHA_KEY}' >> .env"
              fi
            fi

            # Rechargement atomique sans interruption (Zero-Downtime Blue/Green)
            echo "Rechargement atomique Zero-Downtime..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sed -i 's/\r$//' scripts/deploy-zero-downtime.sh
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/deploy-zero-downtime.sh
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S ./scripts/deploy-zero-downtime.sh "${{ github.sha }}" || {
              echo "ERREUR critique: le deploiement Zero-Downtime a echoue!"
              exit 1
            }

            # Rechargement et contrôle du conteneur WhatsApp (WAHA)
            echo "Rechargement de la passerelle WhatsApp (WAHA)..."
            if [ -f "scripts/restart-waha.sh" ]; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x scripts/restart-waha.sh
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S ./scripts/restart-waha.sh || true
            else
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker compose up -d whatsapp || true
            fi
