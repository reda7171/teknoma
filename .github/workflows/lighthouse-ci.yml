name: Lighthouse CI Accessibility, SEO & Contrast

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  lighthouse-audit:
    name: Lighthouse A11y, SEO & Contrast Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: riwaya_db
          MYSQL_USER: riwaya_user
          MYSQL_PASSWORD: riwaya_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Database Schema
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"

      - name: Seed Database
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Verify Sitemap & Robots.txt
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          until curl -s http://localhost:3000/fr > /dev/null 2>&1; do
            sleep 1
          done
          echo "Checking sitemap.xml..."
          SITEMAP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/sitemap.xml)
          if [ "$SITEMAP_STATUS" != "200" ]; then
            echo "Error: sitemap.xml returned HTTP $SITEMAP_STATUS"
            kill $SERVER_PID
            exit 1
          fi
          echo "Checking robots.txt..."
          ROBOTS_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/robots.txt)
          if [ "$ROBOTS_STATUS" != "200" ]; then
            echo "Error: robots.txt returned HTTP $ROBOTS_STATUS"
            kill $SERVER_PID
            exit 1
          fi
          echo "SEO routes valid: sitemap.xml and robots.txt both returned HTTP 200"
          kill $SERVER_PID

      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"
