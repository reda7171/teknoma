name: Lighthouse CI Performance, Accessibility, SEO & Contrast

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  lighthouse-audit:
    name: Lighthouse Performance, A11y, SEO & Contrast Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: 1
      OUTPUT_STANDALONE: "false"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: riwaya_db
          MYSQL_USER: riwaya_user
          MYSQL_PASSWORD: riwaya_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          echo "DATABASE_URL=mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db" >> .env
          echo "DATABASE_URL=mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db" >> .env.production
          echo "DATABASE_URL=mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env.production
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env.local
          echo "NEXT_TELEMETRY_DISABLED=1" >> .env
          echo "OUTPUT_STANDALONE=false" >> .env
          echo "CI=true" >> .env
          echo "CI=true" >> .env.production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security regression tests
        run: npm run test:security

      - name: Setup Database Schema
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"


      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Verify Sitemap & Robots.txt
        run: |
          ./node_modules/.bin/next start -p 3000 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -s http://localhost:3000/fr > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "Checking sitemap.xml..."
          SITEMAP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/sitemap.xml)
          if [ "$SITEMAP_STATUS" != "200" ]; then
            echo "Error: sitemap.xml returned HTTP $SITEMAP_STATUS"
            kill -9 $SERVER_PID 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            exit 1
          fi
          echo "Checking robots.txt..."
          ROBOTS_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/robots.txt)
          if [ "$ROBOTS_STATUS" != "200" ]; then
            echo "Error: robots.txt returned HTTP $ROBOTS_STATUS"
            kill -9 $SERVER_PID 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            exit 1
          fi
          echo "Checking sample book route..."
          BOOK_BODY=$(curl -s http://localhost:3000/fr/books/08f41f86-a23c-48f6-b486-109383b0f6e0)
          if echo "$BOOK_BODY" | grep -q "404\."; then
            echo "Error: sample book route rendered 404 page!"
            kill -9 $SERVER_PID 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            exit 1
          fi
          echo "Sample book route successfully rendered book content"
          echo "Checking packs route..."
          PACKS_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/fr/packs)
          if [ "$PACKS_STATUS" != "200" ]; then
            echo "Error: packs route returned HTTP $PACKS_STATUS"
            kill -9 $SERVER_PID 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            exit 1
          fi
          echo "All audited routes verified with HTTP 200"
          echo "Checking performance latency (TTFB)..."
          HOME_TIME=$(curl -o /dev/null -s -w "%{time_total}" http://localhost:3000/fr)
          echo "Home route response time: ${HOME_TIME}s"
          BOOK_TIME=$(curl -o /dev/null -s -w "%{time_total}" http://localhost:3000/fr/books/08f41f86-a23c-48f6-b486-109383b0f6e0)
          echo "Book detail route response time: ${BOOK_TIME}s"
          kill -9 $SERVER_PID 2>/dev/null || true
          fuser -k 3000/tcp 2>/dev/null || true
          pkill -f "next" 2>/dev/null || true
          sleep 3

      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: false
          temporaryPublicStorage: true
        env:
          DATABASE_URL: "mysql://riwaya_user:riwaya_pass@127.0.0.1:3306/riwaya_db"
