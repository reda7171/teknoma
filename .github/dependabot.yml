version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Casablanca
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-dependencies:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /apps/storefront-ma
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Africa/Casablanca
    open-pull-requests-limit: 3
    groups:
      storefront-dependencies:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Africa/Casablanca
    open-pull-requests-limit: 3
    groups:
      mobile-dependencies:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
