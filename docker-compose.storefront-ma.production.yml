services:
  storefront-ma-production:
    build:
      context: .
      dockerfile: Dockerfile.storefront-ma
      args:
        NEXT_PUBLIC_SITE_URL: https://riwaya.ma
        RIWAYA_MA_INDEXABLE: "true"
    image: riwaya-storefront-ma:production
    container_name: riwaya_storefront_ma_production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: https://riwaya.ma
      RIWAYA_BACKEND_URL: http://riwaya_app:3000
      RIWAYA_MA_INDEXABLE: "true"
    networks:
      - riwaya_network

networks:
  riwaya_network:
    external: true
    name: riwayama_riwaya_network
