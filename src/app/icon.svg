<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Glowing background hint -->
  <circle cx="256" cy="230" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>

  <!-- Tech Monogram "T" -->
  <g>
    <!-- Top Horizontal Bar with tech cuts -->
    <rect x="100" y="120" width="312" height="64" rx="20" fill="url(#primaryGrad)"/>
    
    <!-- Central Vertical Pillar -->
    <rect x="224" y="160" width="64" height="232" rx="20" fill="url(#primaryGrad)"/>

    <!-- Subtle Tech accent dot / power indicator -->
    <circle cx="390" cy="152" r="10" fill="#ffffff" opacity="0.9"/>
    
    <!-- Left & Right Modern High-Tech Brackets -->
    <!-- Left bracket < -->
    <path d="M 72 230 L 44 256 L 72 282" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right bracket > -->
    <path d="M 440 230 L 468 256 L 440 282" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tech chip trace dots at bottom -->
    <circle cx="256" cy="424" r="8" fill="#38bdf8"/>
    <line x1="256" y1="392" x2="256" y2="416" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>