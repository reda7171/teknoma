services:
  # Database - MySQL 8
  db:
    image: mysql:8.0
    container_name: riwaya_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-riwaya_db}
      MYSQL_USER: ${DB_USER:-riwaya_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-riwaya_pass}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3906:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - riwaya_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 20s
      retries: 10

  # Cache & n8n queue - Redis
  redis:
    image: redis:alpine
    container_name: riwaya_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - riwaya_network

  # Application - Next.js
  app:
    image: ghcr.io/reda7171/riwaya-app:latest
    container_name: riwaya_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - WHATSAPP_GATEWAY_URL=http://whatsapp:3000
      - DATABASE_URL=mysql://${DB_USER:-riwaya_user}:${DB_PASSWORD:-riwaya_pass}@db:3306/${DB_NAME:-riwaya_db}?connect_timeout=30
      - KEEP_ALIVE_TIMEOUT=75000
      - NODE_OPTIONS=--max-old-space-size=4096
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - riwaya_network
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/fr || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # n8n - Automation
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: riwaya_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Africa/Casablanca
      - TZ=Africa/Casablanca
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - riwaya_network

  # phpMyAdmin - Database Manager
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: riwaya_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-riwaya_user}
      PMA_PASSWORD: ${DB_PASSWORD:-riwaya_pass}
    ports:
      - "9901:80"
    depends_on:
      - db
    networks:
      - riwaya_network

  # WhatsApp Gateway - Connexion QR gratuite (WAHA / Baileys)
  whatsapp:
    image: devlikeapro/waha
    container_name: riwaya_whatsapp
    restart: always
    ports:
      - "3001:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WHATSAPP_START_SESSION=default
      - WAHA_ZIPPER=ZIPPER
      - WAHA_PRINT_QR=false
    volumes:
      - waha_data:/app/.sessions
    networks:
      - riwaya_network

volumes:
  mysql_data:
  n8n_data:
  redis_data:
  waha_data:

networks:
  riwaya_network:
    driver: bridge
