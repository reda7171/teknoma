# riwaya.ma: migration permanente vers le domaine canonique riwaya.store.
# Les certificats existants restent nécessaires pour accepter les requêtes HTTPS
# avant d'envoyer la redirection.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name riwaya.ma www.riwaya.ma;

    ssl_certificate /etc/letsencrypt/live/riwaya.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riwaya.ma/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://riwaya.store$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name riwaya.ma www.riwaya.ma;

    return 301 https://riwaya.store$request_uri;
}
