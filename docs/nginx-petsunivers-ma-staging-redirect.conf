# staging.petsunivers.ma: l'ancien frontend n'est plus exposé.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.petsunivers.ma;

    ssl_certificate /etc/letsencrypt/live/staging.petsunivers.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.petsunivers.ma/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://petsunivers.ma$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.petsunivers.ma;

    return 301 https://petsunivers.ma$request_uri;
}
