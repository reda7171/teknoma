# Configuration Nginx SEO-Safe : rate-limit strict uniquement sur /admin et /api
# Ne limite jamais les routes publiques (/books, /packs, /collection, /blog, /sitemap*.xml)
# ni /api/merchant-image* autorises pour Googlebot et Googlebot-Image.

# A placer dans le bloc http {} (/etc/nginx/conf.d/riwaya-ratelimit-zones.conf) :
# limit_req_zone $binary_remote_addr zone=riwaya_admin_zone:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=riwaya_api_zone:10m rate=15r/s;

# A placer dans le server {} de riwaya.store avant location / :
location ~ ^/(?:(ar|fr|en)/)?admin(?:/|$) {
    limit_req zone=riwaya_admin_zone burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Routes images Google Merchant exemptees de rate-limit strict
location ^~ /api/merchant-image {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/merchant-pack-image {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/ {
    limit_req zone=riwaya_api_zone burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

