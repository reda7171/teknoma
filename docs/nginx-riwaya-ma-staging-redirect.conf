# staging.riwaya.ma: l'ancien frontend n'est plus exposé.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.riwaya.ma;

    ssl_certificate /etc/letsencrypt/live/staging.riwaya.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.riwaya.ma/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://riwaya.store$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.riwaya.ma;

    return 301 https://riwaya.store$request_uri;
}
