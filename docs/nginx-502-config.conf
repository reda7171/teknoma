# Ajouter DANS le bloc `server { }` de votre config nginx
# (/etc/nginx/sites-enabled/default ou votre fichier de config)

# ─── Page 502 personnalisée ───────────────────────────────────────────
error_page 502 503 504 /502_custom.html;

location = /502_custom.html {
    root /var/www/errors;
    internal;
}
# ─────────────────────────────────────────────────────────────────────
