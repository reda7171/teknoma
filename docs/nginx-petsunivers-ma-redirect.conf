# petsunivers.ma: migration permanente vers le domaine canonique petsunivers.ma.
# Les certificats existants restent nécessaires pour accepter les requêtes HTTPS
# avant d'envoyer la redirection.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name petsunivers.ma www.petsunivers.ma;

    ssl_certificate /etc/letsencrypt/live/petsunivers.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petsunivers.ma/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://petsunivers.ma$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name petsunivers.ma www.petsunivers.ma;

    return 301 https://petsunivers.ma$request_uri;
}
